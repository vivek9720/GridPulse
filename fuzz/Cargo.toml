[package]
name = "gridpulse-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
gridpulse = { path = ".." }
libfuzzer-sys = { path = "libfuzzer-sys" }

[workspace]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "frame_fuzzer"
path = "fuzz_targets/frame_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "script_fuzzer"
path = "fuzz_targets/script_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_fuzzer"
path = "fuzz_targets/replay_fuzzer.rs"
test = false
doc = false
bench = false
