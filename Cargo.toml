[package]
name = "gridpulse"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Offline smart-grid telemetry, outage, and crew-script decoder"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["smart-grid", "telemetry", "parser", "fuzzing"]
categories = ["parser-implementations", "network-programming"]

[dependencies]

[lib]
name = "gridpulse"
path = "src/lib.rs"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
debug = true
overflow-checks = true
panic = "abort"
